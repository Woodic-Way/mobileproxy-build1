name: mobileproxy build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
          cache: false   # 🔴 مهم: خاموش کردن cache

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Clone Outline SDK
        run: git clone https://github.com/OutlineFoundation/outline-sdk.git

      - name: Build AAR
        run: |
          export GO111MODULE=off   # 🔴 مهم: خاموش کردن module mode
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile bind -target=android -androidapi=21 -o mobileproxy.aar ./outline-sdk/x/mobileproxy

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: mobileproxy
          path: mobileproxy.aar
